      "title": "High Resistance and Biofilm Tolerance to Antimicrobials of Marine Bacteria From Brazilian Deep-Sea Sediment.",
      "abstract": "Antimicrobial resistance studies have focused on clinical bacteria, neglecting the role of resistant isolates in natural environments. However, oceans are daily contaminated with high loads of antimicrobials and resistant bacteria from agro-industrial and urban activities. Deep-sea sediment is a challenging environment that may select microbial strains with resistance to chemicals and ability to form biofilms, becoming a potential reservoir of resistance genes. We evaluated the susceptibility to antimicrobials of six Pseudomonas sp., five Bacillus sp., two Brevibacillus sp. and two Paenibacillus sp. from deep-sea sediments of the Pelotas Basin (Brazil) by the disk diffusion and microdilution tests. Pseudomonas and Bacillales were tested against 11 and 7 antimicrobials, respectively. Biofilms of susceptible isolates were exposed to antimicrobials to determine the minimum biofilm inhibitory concentration (MBIC) and the minimum biofilm eradication concentration (MBEC). All Pseudomonas were resistant to aztreonam at very high concentrations (up to 2048 μg/mL). MBIC values were significantly higher than respective MICs, and only one third of biofilms were eradicated. These results underscore the importance of the study, as one of the first reporting antimicrobial tolerance of biofilms of cultivable bacteria from deep-sea sediments, contributing to the knowledge of bacterial resistance in these environments, concerning One Health issues.",

      "abstract_ja": "抗菌薬耐性研究は臨床細菌に重点を置き、自然環境の耐性分離株の役割を見過ごしてきた。しかし海洋には、農工業活動や都市活動に由来する大量の抗菌薬と耐性細菌が日々流入する。深海堆積物は厳しい環境であり、化学物質への耐性とバイオフィルム形成能をもつ株を選択し、耐性遺伝子の貯蔵庫となる可能性がある。ブラジルのPelotas海盆の深海堆積物由来のPseudomonas属6株、Bacillus属5株、Brevibacillus属2株、Paenibacillus属2株について、ディスク拡散法と微量液体希釈法で抗菌薬感受性を評価した。PseudomonasとBacillalesには、それぞれ11種と7種の抗菌薬を試験した。感受性株のバイオフィルムを抗菌薬に曝露し、最小バイオフィルム阻害濃度（MBIC）と最小バイオフィルム根絶濃度（MBEC）を測定した。すべてのPseudomonasは、非常に高い濃度（最大2048 μg/mL）のアズトレオナムに耐性を示した。MBICは対応するMICより有意に高く、根絶できたバイオフィルムは3分の1にとどまった。本研究は深海堆積物由来の培養可能細菌のバイオフィルムにおける抗菌薬寛容性を報告した初期の研究の一つであり、ワンヘルスに関わるこれらの環境の細菌耐性の理解に貢献する。",

      "title": "The seventh pandemic of cholera in Europe revisited by microbial genomics.",
      "abstract": "In 1970, the seventh pandemic of cholera (7 P) reached both Africa and Europe. Between 1970 and 2011, several European countries reported cholera outbreaks of a few to more than 2,000 cases. We report here a whole-genome analysis of 1,324 7 P V. cholerae El Tor (7 PET) isolates, including 172 from autochthonous sporadic or outbreak cholera cases occurring between 1970 and 2011 in Europe, providing insight into the spatial and temporal spread of this pathogen across Europe. In this work, we show that the 7 PET lineage was introduced at least eight times into two main regions: Eastern and Southern Europe. Greater recurrence of the disease was observed in Eastern Europe, where it persisted until 2011. It was introduced into this region from Southern Asia, often circulating regionally in the countries bordering the Black Sea, and in the Middle East before reaching Eastern Africa on several occasions. In Southern Europe, the disease was mostly seen in individual countries during the 1970s and was imported from North and West Africa, except in 1994, when cholera was imported into Albania and Italy from the Black Sea region. These results shed light on the geographic course of cholera during the seventh pandemic and highlight the role of humans in its global dissemination.",
      "journal": "Nature Communications",

      "abstract_ja": "1970年、第7次コレラパンデミック（7P）はアフリカとヨーロッパに到達した。1970–2011年に、ヨーロッパの複数国で数例から2,000例超の流行が報告された。本研究では第7次パンデミックのVibrio cholerae El Tor（7PET）1,324分離株の全ゲノム解析を報告する。このうち172株は1970–2011年にヨーロッパで発生した域内感染の散発例または流行に由来し、病原体の時空間的拡散に知見を与える。7PET系統は、東ヨーロッパと南ヨーロッパという2つの主要地域に少なくとも8回導入されていた。再流行は東ヨーロッパでより多く、2011年まで続いた。この地域には南アジアから導入され、黒海沿岸諸国や中東を地域的に循環した後、東アフリカに複数回到達した。南ヨーロッパでは主に1970年代に個々の国で発生し、北・西アフリカから持ち込まれていた。ただし1994年には黒海地域からアルバニアとイタリアへ導入された。これらの結果は、第7次パンデミックの地理的経路を明らかにし、世界的な拡散における人間の役割を示す。",

      "title": "Co-occurrence is associated with horizontal gene transfer across marine bacteria independent of phylogeny.",
      "abstract": "Understanding the drivers and consequences of horizontal gene transfer (HGT) is a key goal of microbial evolution research. Although co-occurring taxa have long been appreciated to undergo HGT more often, this association is confounded with other factors, most notably their phylogenetic relatedness. To disentangle these factors, we analyzed 15 339 marine prokaryotic genomes (mainly bacteria) and their distribution in the global ocean. We identified HGT events across these genomes and enrichments for functions previously shown to be prone to HGT. By mapping metagenomic reads from 1862 ocean samples to these genomes, we also identified co-occurrence patterns and environmental associations. Although we observed an expected negative association between HGT rates and phylogenetic distance, we only detected an association between co-occurrence and phylogenetic distance for closely related taxa. This observation refines the previously reported trend to closely related taxa, rather than a consistent pattern across all taxonomic levels, at least here within marine environments. In addition, we identified a significant association between co-occurrence and HGT, which remains even after controlling for phylogenetic distance and measured environmental variables. In a subset of samples with extended environmental data, we identified higher HGT levels associated with particle-attached prokaryotes and associations of varying directions with specific environmental variables, such as chlorophyll a and photosynthetically available radiation. Overall, our findings demonstrate the significant influence of ecological associations in shaping marine prokaryotic evolution through HGT.",

      "title_ja": "海洋細菌における共出現は、系統関係とは独立して遺伝子水平伝播と関連する",
      "abstract_ja": "遺伝子水平伝播（HGT）の駆動要因と帰結を理解することは、微生物進化研究の主要な目標である。共出現する分類群でHGTが多いことは以前から認識されているが、この関係は、とりわけ系統的な近縁性などの要因と交絡する。これらを切り分けるため、海洋原核生物の15,339ゲノム（主に細菌）と全球の海洋での分布を解析した。ゲノム間のHGTイベントを同定し、以前からHGTを受けやすいとされる機能の濃縮を検出した。1,862の海洋試料のメタゲノムリードをゲノムにマッピングして、共出現パターンと環境との関連も同定した。予想どおりHGT率と系統距離の負の関連は観察されたが、共出現と系統距離の関連は近縁な分類群でのみ検出された。少なくとも海洋環境では、既報の傾向はすべての分類階層で一貫するのではなく、近縁な分類群に限られることが示された。さらに、系統距離と測定した環境変数を調整しても、共出現とHGTには有意な関連が残った。詳細な環境データをもつ試料の一部では、粒子付着性原核生物でHGTが多く、クロロフィルaや光合成有効放射などの環境変数とは方向の異なる関連が認められた。これらの結果は、生態学的な関連がHGTを通じて海洋原核生物の進化を形作る重要性を示す。",

      "title": "Trajectories of freshwater microbial genomics and greenhouse gas saturation upon glacial retreat.",
      "abstract": "Due to climate warming, ice sheets around the world are losing mass, contributing to changes across terrestrial landscapes on decadal time spans. However, landscape repercussions on climate are poorly constrained mostly due to limited knowledge on microbial responses to deglaciation. Here, we reveal the genomic succession from chemolithotrophy to photo- and heterotrophy and increases in methane supersaturation in freshwater lakes upon glacial retreat. Arctic lakes at Svalbard also revealed strong microbial signatures form nutrient fertilization by birds. Although methanotrophs were present and increased along lake chronosequences, methane consumption rates were low even in supersaturated systems. Nitrous oxide oversaturation and genomic information suggest active nitrogen cycling across the entire deglaciated landscape, and in the high Arctic, increasing bird populations serve as major modulators at many sites. Our findings show diverse microbial succession patterns, and trajectories in carbon and nitrogen cycle processes representing a positive feedback loop of deglaciation on climate warming.",
      "journal": "Nature Communications",
      "doi": "10.1038/s41467-023-38806-w",

      "title_ja": "氷河後退に伴う淡水微生物のゲノム特性と温室効果ガス飽和度の変遷",
      "abstract_ja": "気候温暖化により世界の氷床は質量を失い、数十年規模で陸域景観の変化を引き起こしている。しかし、氷河後退に対する微生物の応答の理解が限られるため、景観変化が気候に及ぼす影響は十分に制約されていない。本研究では、氷河後退に伴う淡水湖で、化学合成独立栄養から光栄養・従属栄養へのゲノム上の遷移と、メタン過飽和度の上昇を示した。スヴァールバルの北極域の湖では、鳥による栄養塩供給の強い微生物学的痕跡も認められた。メタン酸化菌は存在し、湖の年代系列に沿って増加したが、過飽和の系でもメタン消費速度は低かった。亜酸化窒素の過飽和とゲノム情報は、氷河後退後の景観全体で活発な窒素循環があることを示唆し、高緯度北極では鳥の個体数増加が多くの場所で主要な調節要因となっていた。本研究は多様な微生物遷移パターンと炭素・窒素循環過程の変遷を示し、氷河後退が温暖化を促す正のフィードバックを表す。",

      "abstract": "Dimethylsulfoniopropionate (DMSP) catabolism by marine Roseobacters is important for global biogeochemical cycling and the climate. Many Roseobacters contain competing DMSP demethylation and cleavage pathways, but only cleavage produces the climate-cooling gas dimethylsulfide. Here, we identify the \"switch\" regulator in Roseobacters, DmdR, which transcriptionally represses demethylation (dmdA, encoding DMSP demethylase), cleavage (acuI, encoding acryloyl-CoA reductase) and oxidative stress protection (dmdEF, dinB) genes under low intracellular DMSP levels. Increased DMSP levels lead to DMSP cleavage and accumulation of cytotoxic cleavage product acryloyl-CoA. Acryloyl-CoA binding to DmdR derepresses dmdA-acuI transcription to stimulate acryloyl-CoA catabolism and DMSP demethylation. Upregulation of the newly identified peroxidase DmdF, and possibly also of DmdE and DinB, counteracts oxidative stress associated with DMSP demethylation. Thus, DmdR, along with DmdR-independent regulators of DMSP cleavage, likely maintains cellular DMSP levels to allow its antistress functions, but accelerates demethylation and catabolism of toxic intermediates at higher DMSP levels. Of note, DmdR appears to control acryloyl-CoA catabolism/detoxification even in abundant marine bacteria lacking dmdA, suggesting additional mechanisms. DmdR and DmdEF are widespread in Earth's oceans and important for biogeochemical cycling and climate-active gas production.",

      "abstract": "The severe, long-lasting harm caused by plastic pollution to marine ecosystems and coastal economies has led to the development of biodegradable plastics; however, their limited decomposition in marine environments remains a challenge. Here, technologies are presented for creating 3D-bioprinted living materials as a proof of concept for bioplastic degradation, with specific use in marine environments. The approach developed here integrates the halotolerant bioplastic-degrading bacterium Bacillus sp. NRRL B-14911 into alginate-based bio-ink to print an engineered living material (ELM) termed a \"bio-sticker.\" Quantification of bacteria viability reveals that bioprinted marine bacteria survive within biostickers for more than 3 weeks. The rate at which the biostickers degrade the bioplastic polyhydroxybutyrate (PHB) can be tuned by altering biosticker biomass concentration, bioplastic concentration, or incubation temperature. Biostickers that are transferred to a different PHB sample still retain high biodegradation activity, demonstrating their reusability. Strain sweep oscillatory tests demonstrate that the biostickers display predominantly viscoelastic behavior. Monotonic tensile tests indicate that the elastic modulus and the adhesion of the biostickers are not negatively impacted by bacteria growth or incubation temperature. This work paves the way for the development of ELMs to facilitate the inclusion of bioplastics within the blue economy, promoting the emergence of more sustainable and eco-friendly materials.",

      "title": "Structural basis and evolutionary pathways of glycerol-1-phosphate transport in marine bacteria.",
      "abstract": "All cells use lipid membranes to maintain cellular integrity and function, though Archaea utilize lipids composed of glycerol-1-phosphate (G1P), while Bacteria and Eukaryotes use glycerol-3-phosphate (G3P). Given that Archaea contribute significantly to global marine biomass, accounting for 0.3 gigatonnes (Gt) of carbon in the oceans, we aimed to uncover how archaeal G1P is recycled by marine microorganisms. Through a multidisciplinary approach combining microbiology, biochemistry, and structural biology, we identified a G1P transporter in marine bacteria, which we named GpxB. Phylogenetic analysis revealed that GpxB belongs to the organic phosphonate transporter (PhnT) family and is widely distributed in the marine microbiome, found in approximately 5 to 10% of microbial cells in surface marine waters. Strikingly, we also identified a second G1P transporter, UgpB, that is known to transport G3P and belongs to the carbohydrate uptake transporter-1 (CUT1) family, in the model bacterium Phaeobacter sp. MED193. To explore the evolutionary pathways that led to the formation of G1P binding sites in both the PhnT and CUT1 families, we determined the structures of GpxB and UgpB bound to G1P and G3P. Using structure-guided mutagenesis and a comparative analysis of the binding pockets within the PhnT and CUT1 families, we traced their evolutionary trajectories, highlighting the distinct strategies through which G1P-binding sites developed in these two protein families.",

      "title": "Identification of a functional DddX-like enzyme that catalyzes dimethylsulfoniopropionate cleavage in marine bacteria.",
      "abstract": "Dimethylsulfoniopropionate (DMSP), a ubiquitous organosulfur compound in marine environments, plays an important role in global sulfur cycling and climate regulation. Many marine microorganisms catabolize DMSP through DMSP lytic enzymes, producing the infochemical and potential climate-cooling gas dimethyl sulfide (DMS). The marine Roseobacter group (MRG) is one of the most abundant heterotrophic bacteria groups in marine ecosystems and an active participant in DMSP cycling. To expand our knowledge of the diversity of DMSP lytic enzymes, we identified and characterized a functional DddX-like enzyme from the MRG strain Neptunicoccus cionae H-12 and other related bacteria, such as Leisingera spp., Sulfitobacter spp., and Roseovarius spp. This enzyme catalyzes the cleavage of DMSP into DMS and acryloyl-CoA. Although the DddX-like enzyme belongs to the same acyl-CoA synthetase superfamily as DddX, a previously reported DMSP lytic enzyme, it shares low amino acid sequence identity (∼23%) with DddX. Phylogenetic analysis suggested that the DddX-like enzyme formed a separate clade from DddX, with the DddX-like enzyme predominantly distributed in the cosmopolitan MRG. Bioinformatic analysis indicated that the relative abundance of dddX and dddX-like genes, along with their transcripts, is notably high in marine environments, suggesting their important roles in DMSP cycling. Our findings enhance knowledge of DMSP lytic enzymes and provide novel insights into global sulfur cycling processes.",

      "abstract_ja": "海洋に広く存在する有機硫黄化合物ジメチルスルホニオプロピオン酸（DMSP）は、全球の硫黄循環と気候調節に重要な役割を果たす。多くの海洋微生物はDMSP開裂酵素によってDMSPを異化し、情報化学物質であり気候冷却効果をもつ可能性のある気体、硫化ジメチル（DMS）を生成する。海洋Roseobacter群（MRG）は海洋生態系で最も豊富な従属栄養細菌群の一つであり、DMSP循環に積極的に関与する。DMSP開裂酵素の多様性に関する知識を拡張するため、MRGのNeptunicoccus cionae H-12株と、Leisingera属、Sulfitobacter属、Roseovarius属などの関連細菌から、機能的DddX様酵素を同定して特性評価した。この酵素はDMSPをDMSとアクリロイルCoAへ開裂する。既報のDMSP開裂酵素DddXと同じアシルCoA合成酵素スーパーファミリーに属するが、アミノ酸配列一致度は低かった（約23%）。系統解析から、DddX様酵素はDddXとは別のクレードを形成し、世界各地に分布するMRGに主に存在することが示唆された。バイオインフォマティクス解析では、dddXおよびdddX様遺伝子とその転写産物の相対存在量が海洋環境で顕著に高く、DMSP循環での重要性が示唆された。本研究はDMSP開裂酵素に関する知識を深め、全球の硫黄循環過程に新たな知見をもたらす。",

      "abstract": "dTDP-L-rhamnose (Deoxythymidine diphospho-L-rhamnose) is a crucial active sugar nucleotide that serves as the key glycosyl donor for the synthesis of rhamnose-containing polysaccharides in bacteria, holding broad application potential in pathogen-associated molecular mimicry and vaccine development. In this study, the rhamnose synthase gene cluster (Pa-RmlABCD) was successfully cloned for the first time from the marine bacterium Pseudoalteromonas agarivorans Hao 2018. Four key enzymes-Glc-1-P thymidylyltransferase (Pa-RmlA), dTDP-glucose-4,6-dehydratase (Pa-RmlB), dTDP-4-keto-6-deoxyglucose 3,5-epimerase (Pa-RmlC), and dTDP-4-keto-rhamnose reductase (Pa-RmlD)-were heterologously expressed in Escherichia coli. A one-pot four-enzyme synthesis system was constructed, and the successful synthesis of dTDP-L-rhamnose was verified by Q Exactive Focus. After correction for recovery (92% ± 2%), the actual yield reached 3.47 mg/L with a conversion rate of 53.4% ± 1.1%. Combined with bioinformatics analysis, tertiary structure modeling, and molecular docking simulations, the sequence characteristics, substrate binding modes, and catalytic mechanisms of Pa-RmlABCD were systematically elucidated. By characterizing the marine-derived Pa-RmlABCD system and achieving efficient one-pot synthesis, this work opens up a new avenue for the sustainable production of dTDP-L-rhamnose, with the potential to alleviate the current industrial supply constraints.",

act('home',goHome);act('choice',el=>{selection=options[Number(el.dataset.option)];quiz()});act('confirm',()=>{if(selection===null)return;if(stage==='title')state.answers[p.id]={first:selection};else state.answers[p.id].final=selection;selection=null;persist();render()});act('save',()=>{if(saved[p.id])delete saved[p.id];else saved[p.id]={id:p.id,title:p.title,title_ja:p.title_ja,journal:p.journal,doi:p.doi};persist();quiz()});act('next',()=>{state.index++;selection=null;normalize();persist();render()})}
function summary(){const complete=getBatch().filter(p=>state.answers[p.id]?.final!==undefined),scored=complete.filter(p=>!forecast(p)),n=scored.length,first=scored.filter(p=>state.answers[p.id].first===answer(p)).length,final=scored.filter(p=>state.answers[p.id].final===answer(p)).length,remaining=papers.length-(state.batch+1)*5;
mount(`<div class="eyebrow">${t('今回の結果','ROUND COMPLETE')}</div><h1>${complete.length}${t('問完了',' papers completed')}</h1><p class="muted">${t('採点対象は掲載先が確定した論文のみです。未出版の予想：','Only confirmed publication venues are scored. Pending forecasts: ')}${complete.length-n}</p><div class="scoregrid"><div class="score">${t('タイトルの予想','Title prediction')}<strong>${first}<small style="font-size:20px"> / ${n}</small></strong></div><div class="score">${t('アブストラクト後','After the abstract')}<strong>${final}<small style="font-size:20px"> / ${n}</small></strong></div></div><div class="actions">${remaining>0?`<button class="primary" data-action="more">${remaining>=5?t('もう5問に挑戦 →','Try five more →'):t('残り'+remaining+'問に挑戦 →','Try the remaining '+remaining+' →')}</button>`:'<span class="badge">'+t('この号の問題をすべて完了しました','All papers in this issue completed')+'</span>'+(allComplete()?`<button class="primary" data-action="replay">${t((state.lap||1)+1+'周目へ →','Start pass '+((state.lap||1)+1)+' →')}</button>`:'')}<button class="secondary" data-action="saved">${t('保存した論文を見る','Saved papers')}</button><button class="quiet" data-action="home">${t('ホームへ','Home')}</button></div><p class="hint">${t('追加チャレンジの成績は、今週の5問と分けて記録します。','Extra rounds are scored separately from the first five.')}</p><div class="sectionhead"><span class="eyebrow">${t('回答一覧','YOUR ANSWERS')}</span></div>${complete.map(p=>`<div class="review"><span class="badge">${resultMark(p,state.answers[p.id])}</span><h3 lang="en">${esc(p.title)}</h3><p lang="ja">${esc(p.title_ja)}</p><p>${esc(answer(p)||t('bioRxiv · 掲載先未確定','bioRxiv · Journal pending'))} · <a href="${esc(link(p))}" target="_blank" rel="noopener">${t('原著','Paper')} ↗</a></p></div>`).join('')}`);act('replay',replay);act('more',()=>{state.batch++;state.index=0;state.screen='quiz';selection=null;persist();render()});act('saved',savedView);act('home',goHome)}
let view='quiz';
function savedView(){view='saved';mount(`<div class="eyebrow">${t('保存した論文','SAVED PAPERS')}</div><h1>${t('あとで読む','Read later')}</h1><p class="muted">${t('このブラウザに保存された論文です。','Papers saved in this browser.')}</p><div class="actions"><button class="secondary" data-action="back">${t('クイズに戻る','Back to quiz')}</button><button class="quiet" data-action="export">${t('一覧をJSONで保存','Export JSON')}</button></div>${Object.values(saved).map(p=>`<div class="saved-item"><h3 lang="en">${esc(p.title)}</h3><p lang="ja">${esc(p.title_ja)}</p><span class="badge">${esc(p.journal)}</span> <a href="${esc(link(p))}" target="_blank" rel="noopener">${t('原著を読む','Read paper')} ↗</a><button class="quiet" data-action="remove" data-id="${esc(p.id)}">${t('保存を解除','Remove')}</button></div>`).join('')||'<p style="margin-top:40px">'+t('保存した論文はありません。','No saved papers yet.')+'</p>'}`);act('back',render);act('remove',el=>{delete saved[el.dataset.id];persist();savedView()});act('export',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(Object.values(saved),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='paper-current-reading-list.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})}
function render(){view='quiz';if(state.screen==='summary')summary();else if(state.screen==='quiz')quiz();else home()}
function switchIssue(data,archived){
  persist();DATA=data;viewingArchive=archived;papers=uniquePapers(data.papers);
  key='paper-current-v1:'+DATA.issue.id+(mode==='professional'?':professional':'');state=read(key,{batch:0,index:0,screen:'home',answers:{}});
  isDemo=DATA.papers.some(p=>p.demo)||DATA.issue.id.startsWith('prototype');selection=null;
}
function goHome(){try{history.replaceState(null,'',location.pathname)}catch{}state.screen='home';persist();if(viewingArchive)switchIssue(INITIAL_DATA,false);state.screen='home';persist();render()}
function archivedEntries(){
  if(!archiveIndex)return [];
  const days=archiveIndex.archive_after_days??90,cutoff=Date.now()-days*86400000;
  return archiveIndex.issues.filter(i=>Date.parse(i.date+'T00:00:00Z')<=cutoff).sort((a,b)=>b.date.localeCompare(a.date));
}
async function loadArchiveIndex(){
  if(archiveLoading)return;archiveLoading=true;
  try{const r=await fetch('data/archive-index.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);archiveIndex=await r.json();archiveError=false}
  catch{archiveError=true}finally{archiveLoading=false;if(state.screen==='home'&&view==='quiz')renderArchivePanel()}
}
function renderArchivePanel(){
  const panel=document.querySelector('#archive-panel');if(!panel)return;
  const entries=archivedEntries(),years=[...new Set(entries.map(i=>String(i.year)))];
  panel.innerHTML=`<div class="sectionhead"><h2>${t('過去問アーカイブ','Past quizzes')}</h2><span class="badge">${archiveIndex?.archive_after_days??90}${t('日経過後',' days after release')}</span></div><p class="muted">${t('年と月を指定して過去問を選べます。問題データは選んだ回だけ読み込みます。','Choose a year and month. Only the selected issue is downloaded.')}</p>${archiveError?'<p class="hint">'+t('過去問の取得に失敗しました。GitHub Pages上で再試行してください。','Could not load archives. Try again on GitHub Pages.')+'</p><button class="secondary" data-action="retry-index">'+t('再試行','Retry')+'</button>':!archiveIndex?'<p>'+t('アーカイブ一覧を読み込み中…','Loading archive index…')+'</p>':!entries.length?'<p class="hint">'+t('対象期間を過ぎた過去問はまだありません。','No issues have reached the archive age yet.')+'</p>':`<div class="archive-filters"><label>${t('年','Year')}<select id="archive-year">${years.map(y=>'<option>'+esc(y)+'</option>').join('')}</select></label><label>${t('月','Month')}<select id="archive-month"></select></label></div><div id="archive-issues"></div>`}`;
  act('retry-index',loadArchiveIndex);
  if(entries.length){const year=document.querySelector('#archive-year'),month=document.querySelector('#archive-month');
    const updateMonth=()=>{const months=[...new Set(entries.filter(i=>String(i.year)===year.value).map(i=>i.month))];month.innerHTML=months.map(m=>'<option value="'+m+'">'+m+'</option>').join('');updateIssues()};
    const updateIssues=()=>{document.querySelector('#archive-issues').innerHTML=entries.filter(i=>String(i.year)===year.value&&String(i.month)===month.value).map(i=>`<div class="archive-row"><span><b>${esc(i.id)}</b><br><small>${esc(i.date)} · ${i.count}${t('問',' papers')}</small></span><button class="secondary" data-action="archive-open" data-id="${esc(i.id)}">${t('この回を遊ぶ','Play this issue')} →</button></div>`).join('');act('archive-open',el=>openArchive(el.dataset.id))};
    year.onchange=updateMonth;month.onchange=updateIssues;updateMonth();
  }
  if(!archiveIndex&&!archiveLoading&&!archiveError)loadArchiveIndex();
}
async function openArchive(id){
  const entry=archiveIndex?.issues.find(i=>i.id===id);if(!entry)return;
  if(!/^data\/issues\/[a-zA-Z0-9_-]+\.json$/.test(entry.path))return;
  const panel=document.querySelector('#archive-panel');
  try{const r=await fetch(entry.path);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.papers)||data.issue?.id!==id)throw Error('Invalid archive');switchIssue(data,true);try{history.replaceState(null,'','?issue='+encodeURIComponent(id))}catch{}state.screen='home';persist();render();return true}
  catch{if(panel){const p=document.createElement('p');p.className='hint';p.textContent=t('この回を読み込めませんでした。もう一度お試しください。','Unable to load this issue. Please try again.');panel.appendChild(p)}return false}
}
document.querySelector('#savedBtn').onclick=savedView;document.querySelector('#languageBtn').onclick=()=>{uiLang=uiLang==='ja'?'en':'ja';persist();if(view==='saved')savedView();else render()};
(async()=>{const requested=new URLSearchParams(location.search).get('issue');if(requested){await loadArchiveIndex();if(archivedEntries().some(i=>i.id===requested)&&await openArchive(requested))return}render()})();
</script></body></html>
