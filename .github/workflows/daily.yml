name: Daily collection, PLaMo translation and publication
on:
  schedule:
    - cron: '17 9 * * *'
      timezone: Asia/Tokyo
    - cron: '43 3,15,21 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - '.github/actions/setup-plamo/**'
      - 'scripts/cloud_daily.py'
      - 'config/cloud.json'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: automation-state
          path: .automation-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate pipeline
        run: |
          python -m unittest discover -s tests -v
          npm test
      - name: Restore durable queue and translations
        run: python scripts/cloud_daily.py restore
      - name: Collect daily papers and select unfinished translations
        id: prepare
        run: python -u scripts/cloud_daily.py prepare
      - name: Checkpoint collected papers before model setup
        run: python scripts/cloud_daily.py save
      - uses: ./.github/actions/setup-plamo
        if: steps.prepare.outputs.needs_translation == 'true' || github.event_name == 'push'
        id: model
      - name: Translate with four concurrent requests
        if: steps.prepare.outputs.needs_translation == 'true' || github.event_name == 'push'
        run: python -u scripts/cloud_daily.py translate --server "${{ steps.model.outputs.server }}" --model-file "${{ steps.model.outputs.model }}"
      - name: Append eligible papers to the current weekly issue
        run: python scripts/cloud_daily.py publish
      - name: Commit and push publication data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/papers.js docs/data/recent-papers.js docs/data/archive-index.json docs/data/issues/
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily Paper Current additions"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          fi
          python scripts/cloud_daily.py confirm
      - name: Checkpoint queue even after a failed stage
        if: always() && steps.prepare.outcome != 'skipped' && steps.prepare.outcome != ''
        run: python scripts/cloud_daily.py save
      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('work/cloud/cloud-status.json')
          if p.exists():
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Paper Current\n\n```json\n'+json.dumps(json.loads(p.read_text()),ensure_ascii=False,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-status-${{ github.run_id }}
          path: |
            work/cloud/cloud-status.json
            work/cloud/model-server.log
            work/cloud/inbox.json.report.json
          if-no-files-found: ignore
          retention-days: 7
      # GITHUB_TOKEN pushes do not trigger pages.yml; deploy this exact workspace.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
