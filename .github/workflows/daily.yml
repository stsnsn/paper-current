name: Hourly collection and scheduled translation/publication
on:
  schedule:
    - cron: '12 * * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - '.github/actions/setup-plamo/**'
      - '.github/actions/deploy-pages-with-retry/**'
      - 'scripts/cloud_daily.py'
      - 'config/cloud.json'
      - 'config/backfill-request.json'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      publication_sha: ${{ steps.publication.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: automation-state
          path: .automation-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate pipeline
        run: |
          python -m unittest discover -s tests -v
          npm test
      - name: Restore durable queue and translations
        id: restore
        run: python scripts/cloud_daily.py restore
      - name: Process uncompleted manual backfill request
        run: python -u scripts/cloud_daily.py backfill-request
      - name: Checkpoint manual backfill progress
        run: python scripts/cloud_daily.py save
      - name: Collect hourly papers and select scheduled translations
        id: prepare
        run: python -u scripts/cloud_daily.py prepare
      - name: Checkpoint collected papers before model setup
        run: python scripts/cloud_daily.py save
      - uses: ./.github/actions/setup-plamo
        if: steps.prepare.outputs.needs_translation == 'true'
        id: model
      - name: Translate with four concurrent requests
        if: steps.prepare.outputs.needs_translation == 'true'
        run: python -u scripts/cloud_daily.py translate --server "${{ steps.model.outputs.server }}" --model-file "${{ steps.model.outputs.model }}"
      - name: Append eligible papers to the current weekly issue
        if: steps.prepare.outputs.publication_due == 'true'
        run: python scripts/cloud_daily.py publish
      - name: Commit and push publication data
        id: publication
        if: steps.prepare.outputs.publication_due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/papers.js docs/data/recent-papers.js docs/data/archive-index.json docs/data/issues/ docs/data/explorer/
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily Paper Current additions"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:refs/heads/main
          fi
          python scripts/cloud_daily.py confirm
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - name: Checkpoint queue even after a failed stage
        if: always() && steps.restore.outcome == 'success'
        run: python scripts/cloud_daily.py save
      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('work/cloud/cloud-status.json')
          report=Path('work/cloud/inbox.json.report.json')
          if report.exists():
            data=json.loads(report.read_text())
            state_path=Path('work/cloud/auto-state.json')
            state=json.loads(state_path.read_text()) if state_path.exists() else {}
            coverage=data.get('coverage',{})
            errors={item.get('source') for item in data.get('errors',[])}
            completed=[source for source,row in coverage.items() if row.get('ok')]
            failed=sorted(errors-{*completed})
            unfinished=[source for source in data.get('planned_sources',[])
                        if source not in completed and source not in errors]
            label=('Incomplete when collection timed out' if state.get('collection_exit_code')=='timeout'
                   else 'Completion unconfirmed')
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Collection coverage\n\n')
              for heading,sources in [('Completed',completed),('Source errors',failed),(label,unfinished)]:
                summary.write(f'**{heading} ({len(sources)})**\n\n')
                for source in sources:
                  summary.write(f'- {source}\n')
                summary.write('\n')
          else:
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Collection coverage\n\nNo collection report was produced in this run.\n\n')
          if p.exists():
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Paper Current\n\n```json\n'+json.dumps(json.loads(p.read_text()),ensure_ascii=False,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-status-${{ github.run_id }}
          path: |
            work/cloud/cloud-status.json
            work/cloud/model-server.log
            work/cloud/inbox.json.report.json
            work/cloud/inbox.json.filter.json
            work/cloud/backfill-progress.json
            work/backfill/
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    name: Deploy published data to GitHub Pages
    needs: update
    if: needs.update.outputs.publication_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.publication_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: ./.github/actions/deploy-pages-with-retry
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
